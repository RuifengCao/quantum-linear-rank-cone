name: selftest
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y lrslib build-essential
      - run: pip install -r requirements.txt
      - run: python3 selftest.py --full
