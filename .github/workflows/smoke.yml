name: smoke (manual)
on: [workflow_dispatch]
jobs:
  smokes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y lrslib build-essential
      - run: pip install -r requirements.txt
      - run: python3 scripts/run_job.py run a1-campaign --smoke
      - run: python3 scripts/run_job.py run server-batch --smoke
